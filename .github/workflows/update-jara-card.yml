name: Update JARA NOX homepage card
on:
  push:
    branches: [main]
    paths: ['.github/workflows/update-jara-card.yml']
permissions:
  contents: write
jobs:
  portrait:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify source and prepare sharp homepage portrait
        run: |
          curl --fail --location --retry 2 'https://d2ol7oe51mr4n9.cloudfront.net/user_3FOKCt5dRl2FwUMqsVyqnirHTZU/eaaa1e63-d562-4208-b0a8-548eb9be0d1b.png' -o /tmp/jara-card.png
          echo '506c3dc5d1954b26fa0ec45e2f80fb1ac8b7bce4ec4e8fe7bb4014afd54b7a47  /tmp/jara-card.png' | sha256sum -c -
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image, ImageChops
          from pathlib import Path
          target = 'assets/jara-nox-card-v2.webp'
          with Image.open('/tmp/jara-card.png') as im:
              im.load()
              assert im.size == (1122,1402)
              original=im.convert('RGB')
              original.save(target,lossless=True,method=6)
          with Image.open(target) as im:
              im.load()
              assert im.size == (1122,1402)
              assert ImageChops.difference(original,im.convert('RGB')).getbbox() is None
          p=Path('index.html')
          s=p.read_text()
          old='<a class="voice" href="jara-nox.html" data-artist="jara">\n            <img src="assets/jara-nox-artist.webp" alt="JARA NOX, sun-lit hair, looking into the camera" loading="lazy" />'
          new='<a class="voice" href="jara-nox.html" data-artist="jara">\n            <img src="assets/jara-nox-card-v2.webp" alt="JARA NOX, highlighted hair in a bun, looking into the camera" loading="lazy" />'
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY
      - name: Commit verified card and remove temporary importer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/jara-nox-card-v2.webp index.html
          git rm .github/workflows/update-jara-card.yml
          git commit -m 'Replace only JARA NOX homepage card with approved portrait'
          git push origin HEAD:main
