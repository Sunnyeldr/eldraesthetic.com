name: Prepare sharp RYNVA portrait
on:
  push:
    branches: [main]
    paths: ['.github/workflows/prepare-rynva-portrait.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crop original to native 4-to-5 and verify lossless pixels
        run: |
          curl --fail --location --retry 2 'https://d2ol7oe51mr4n9.cloudfront.net/user_3FOKCt5dRl2FwUMqsVyqnirHTZU/8f19782b-08b6-4625-8386-e49640562934.png' -o /tmp/rynva-original.png
          echo '4ce94b37d5ffada641e00b8111cb58f598a1037124654edee69619ec1bb7641d  /tmp/rynva-original.png' | sha256sum -c -
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image, ImageChops
          with Image.open('/tmp/rynva-original.png') as im:
              im.load()
              assert im.size == (1024,1536)
              crop = im.convert('RGB').crop((0,51,1024,1331))
              crop.save('assets/rynva-profile-4x5-lossless.webp', lossless=True, method=6)
          with Image.open('assets/rynva-profile-4x5-lossless.webp') as im:
              im.load()
              assert im.size == (1024,1280)
              assert ImageChops.difference(crop,im.convert('RGB')).getbbox() is None
          PY
      - name: Commit verified asset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/rynva-profile-4x5-lossless.webp
          git rm .github/workflows/prepare-rynva-portrait.yml
          git commit -m 'Add lossless native 4:5 RYNVA portrait'
          git push origin HEAD:main
