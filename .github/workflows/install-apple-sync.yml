name: Refresh ELDR Apple Music catalogue
on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/install-apple-sync.yml', 'scripts/sync-apple-catalogue.py']
concurrency:
  group: eldr-apple-sync
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check catalogue code
        run: |
          set -e
          for f in assets/eldr-core.js assets/eldr-catalogue-merge.js assets/eldr-countdown.js assets/eldr-artist.js assets/eldr-home.js assets/rynva-north.js assets/sunriva-mist.js assets/jara-midnight.js; do node --input-type=module --check < "$f"; done
          node --test tests/catalogue-union.test.mjs
          python3 -m py_compile scripts/sync-apple-catalogue.py
      - name: Refresh release and track catalogue
        run: python3 scripts/sync-apple-catalogue.py
      - name: Save verified catalogue
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/eldr-apple-catalogue.json data/eldr-apple-album-tracks.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh verified Apple Music catalogue and album tracks'
          git pull --rebase origin main
          git push origin HEAD:main
