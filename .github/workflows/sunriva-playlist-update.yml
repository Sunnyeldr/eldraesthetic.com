name: Restore SUNRIVA playlist player
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sunriva-playlist-update.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add click-to-load player
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          p=Path('sunriva.html')
          s=p.read_text()
          assert 'id="playlist"' not in s
          assert '</details></section><section class="section" id="videos">' in s
          playlist='''<section class="sr-playlist" id="playlist" aria-labelledby="sr-playlist-title"><p class="eyebrow">Official playlist</p><h2 id="sr-playlist-title">Best of SUNRIVA</h2><p class="sr-playlist-intro">Discover SUNRIVA’s music in one place.</p><a class="textlink sr-playlist-direct" href="https://open.spotify.com/playlist/27QDkBCLpMStvufPMqthw4" target="_blank" rel="noopener noreferrer">Open playlist on Spotify</a><div class="sr-player-shell"><div class="sr-player-prompt" data-sr-player-prompt><svg viewBox="0 0 24 24" width="66" height="66" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="11.5" fill="#1ed760"/><g fill="none" stroke="#0b1116" stroke-linecap="round"><path d="M5.5 9c4.4-1.4 9.4-.9 13.2 1.5" stroke-width="1.9"/><path d="M6.7 12.4c3.7-1 7.5-.5 10.6 1.3" stroke-width="1.6"/><path d="M7.9 15.5c2.9-.7 5.7-.3 8 1" stroke-width="1.4"/></g></svg><p>Load the Spotify player? Spotify may set cookies and process your data.</p><button type="button" class="btn primary" data-sr-player-load hidden>Load player</button><a class="sr-player-privacy" href="datenschutz.html">Privacy policy</a></div><div data-sr-player-frame hidden></div></div></section>'''
          s,n=re.subn(r'<div class="lower"><a class="textlink" href="https://open\.spotify\.com/playlist/27QDkBCLpMStvufPMqthw4"[^>]*>[^<]*</a></div>','',s)
          assert n==1
          s=s.replace('</details></section><section class="section" id="videos">','</details>'+playlist+'</section><section class="section" id="videos">')
          for old,new in [('sunriva-mist.css?v=7','sunriva-mist.css?v=8'),('sunriva-mist.js?v=7','sunriva-mist.js?v=8'),('sunriva-menu.js?v=1','sunriva-menu.js?v=2'),('sunriva-mist-motion.js?v=7','sunriva-mist-motion.js?v=8')]:
              assert old in s
              s=s.replace(old,new)
          assert '↗' not in s and '<iframe' not in s
          p.write_text(s)
          p=Path('assets/sunriva-mist.css')
          p.write_text(p.read_text()+'''
          /* Nordic Mist — consent-based official playlist */
          .sr-playlist{margin-top:36px;padding:clamp(22px,4vw,42px);border-radius:28px;background:radial-gradient(ellipse at 0% 0%,#24404780,transparent 75%),#131c22;scroll-margin-top:24px}
          .sr-playlist h2{font-size:clamp(1.85rem,4vw,3.15rem);margin:12px 0 16px}
          .sr-playlist-intro{color:var(--muted);max-width:650px;font-size:.98rem}
          .sr-playlist-direct{display:inline-block;margin:18px 0 22px}
          .sr-player-shell{border-radius:20px;background:#0b1116b5;overflow:hidden}
          .sr-player-prompt{min-height:352px;padding:32px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px}
          .sr-player-prompt p{max-width:430px;color:var(--muted);font-size:.92rem}
          .sr-player-privacy{font-size:.72rem;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
          .sr-player-shell iframe{display:block;border:0;width:100%;height:352px;border-radius:20px}
          @media(max-width:650px){.sr-playlist{margin-top:26px;border-radius:22px;padding:22px 17px}.sr-playlist-intro{font-size:.88rem}.sr-player-prompt{min-height:320px;padding:25px 18px}.sr-player-prompt p{font-size:.85rem}}
          ''')
          p=Path('assets/sunriva-mist.js')
          p.write_text(p.read_text()+'''
          /* Explicit activation: no Spotify iframe is created until the visitor clicks. */
          const playlistLoad=document.querySelector("[data-sr-player-load]");
          if(playlistLoad){
            playlistLoad.hidden=false;
            playlistLoad.addEventListener("click",()=>{
              const frame=document.createElement("iframe");
              frame.title="Best of SUNRIVA — Spotify";
              frame.src="https://open.spotify.com/embed/playlist/27QDkBCLpMStvufPMqthw4";
              frame.allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture";
              frame.allowFullscreen=true;
              const slot=document.querySelector("[data-sr-player-frame]");
              slot.replaceChildren(frame);
              slot.hidden=false;
              document.querySelector("[data-sr-player-prompt]").hidden=true;
              frame.focus({preventScroll:true});
            },{once:true});
          }
          ''')
          p=Path('assets/sunriva-menu.js')
          d={"Official playlist":["Offizielle Playlist","Opinber spilunarlisti"],"Discover SUNRIVA’s music in one place.":["SUNRIVAs Musik an einem Ort.","Tónlist SUNRIVA á einum stað."],"Open playlist on Spotify":["Playlist auf Spotify öffnen","Opna spilunarlista á Spotify"],"Load the Spotify player? Spotify may set cookies and process your data.":["Spotify-Player laden? Dabei kann Spotify Cookies setzen und deine Daten verarbeiten.","Hlaða Spotify-spilaranum? Spotify kann að vista vafrakökur og vinna úr gögnum þínum."],"Load player":["Player laden","Hlaða spilara"],"Privacy policy":["Datenschutzerklärung","Persónuverndarstefna"]}
          s=p.read_text()
          assert 'const translations={' in s
          p.write_text(s.replace('const translations={','const translations={'+json.dumps(d,ensure_ascii=False)[1:-1]+',',1))
          p=Path('assets/sunriva-mist-motion.js')
          s=p.read_text()
          assert '.profile,.lower,details,' in s
          p.write_text(s.replace('.profile,.lower,details,','.profile,.lower,.sr-playlist,details,'))
          PY
          node --input-type=module --check < assets/sunriva-mist.js
          node --check assets/sunriva-menu.js
          node --check assets/sunriva-mist-motion.js
      - name: Commit artist-only changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sunriva.html assets/sunriva-mist.css assets/sunriva-mist.js assets/sunriva-menu.js assets/sunriva-mist-motion.js
          git rm .github/workflows/sunriva-playlist-update.yml
          git commit -m 'Restore SUNRIVA playlist player with explicit consent'
          git push origin HEAD:main
