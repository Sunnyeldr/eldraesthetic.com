name: SUNRIVA multi-platform music and countdown
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sunriva-music-update.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update SUNRIVA music
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('sunriva.html')
          s=p.read_text()
          assert 'data-sr-player-load' in s and 'data-latest-release' in s
          apple='https://music.apple.com/us/artist/sunriva/6785632733'
          spotify='https://open.spotify.com/artist/0EZ3VnaZOkGWYyYMxYdJzZ'
          def ext(url,label,cls='btn secondary'):
              return f'<a class="{cls}" href="{url}" target="_blank" rel="noopener noreferrer">{label}</a>'
          count='''<section class="sr-next" data-next hidden aria-labelledby="sr-next-title"><p class="eyebrow">Coming soon</p><h2 id="sr-next-title" data-next-title></h2><p class="meta" data-next-date></p><div class="sr-countdown" role="timer" aria-label="Release countdown"><div><strong data-days>00</strong><span>Days</span></div><div><strong data-hours>00</strong><span>Hours</span></div><div><strong data-minutes>00</strong><span>Minutes</span></div><div><strong data-seconds>00</strong><span>Seconds</span></div></div><a class="btn primary" data-presave hidden target="_blank" rel="noopener noreferrer">Pre-save / Pre-add</a></section>'''
          s=s.replace('<main class="wrap" id="main">','<main class="wrap" id="main">'+count,1)
          old='<a class="textlink" href="'+spotify+'" rel="noopener noreferrer" target="_blank">Spotify</a></div><article'
          assert old in s
          s=s.replace(old,'<div class="sr-service-row">'+ext(spotify,'Spotify')+ext(apple,'Apple Music')+'</div></div><article',1)
          import re
          s,n=re.subn(r'<a class="btn primary" data-latest-link=""[^>]*>[^<]*</a>', '<div class="sr-service-row" data-latest-services><a class="btn primary" data-latest-link="" target="_blank" rel="noopener noreferrer">Spotify</a></div>',s,count=1)
          assert n==1
          s=s.replace('<div class="releases" data-recent="">','<div class="sr-album-highlight" data-album-highlight hidden></div><div class="releases" data-recent="">',1)
          s=s.replace('Discover SUNRIVA’s latest music on <a class="textlink" href="'+spotify+'" rel="noopener noreferrer" target="_blank">Spotify</a>.','Discover SUNRIVA’s latest music on <a class="textlink" href="'+spotify+'" rel="noopener noreferrer" target="_blank">Spotify</a> · <a class="textlink" href="'+apple+'" rel="noopener noreferrer" target="_blank">Apple Music</a>.')
          s=s.replace('<div class="sr-player-shell">','<details class="sr-player-toggle"><summary>Listen to the Spotify playlist</summary><div class="sr-player-shell">',1)
          s=s.replace('<div data-sr-player-frame hidden></div></div></section>','<div data-sr-player-frame hidden></div></div></details><div class="sr-apple-discover">'+ext(apple,'Discover SUNRIVA on Apple Music')+'</div></section>',1)
          for name,old,new in [('sunriva-mist.css','8','9'),('sunriva-mist.js','8','9'),('sunriva-menu.js','2','3')]:
              assert name+'?v='+old in s
              s=s.replace(name+'?v='+old,name+'?v='+new)
          assert '↗' not in s and 'data-next hidden' in s and 'sr-player-toggle' in s
          p.write_text(s)
          p=Path('data/sunriva-upcoming.json')
          if not p.exists(): p.write_text('[]\n')
          p=Path('assets/sunriva-mist.css')
          p.write_text(p.read_text()+'''
          /* Balanced music services and upcoming release */
          .sr-service-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.sr-service-row .btn{font-size:.65rem;letter-spacing:.07em;padding:10px 14px;min-height:40px;background:#e4eeee;color:#0b1116;box-shadow:none}.release .sr-service-row{margin-top:8px}.release .sr-service-row .btn{font-size:.58rem;padding:7px 10px;min-height:34px;background:#22353e;color:#e4eeee}.sr-service-row .btn:hover{background:#fff;color:#0b1116}.sr-next{padding:30px;margin:30px 0 0;border-radius:24px;background:linear-gradient(125deg,#20343d,#131c22)}.sr-next h2{margin:8px 0 12px}.sr-next .meta{color:var(--muted)}.sr-countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0;max-width:520px}.sr-countdown div{text-align:center;padding:14px 4px;background:#0b1116aa;border-radius:15px}.sr-countdown strong{display:block;font:clamp(1.6rem,5vw,3rem) Georgia;color:var(--text);font-variant-numeric:tabular-nums}.sr-countdown span{display:block;color:var(--muted);font-size:.68rem}.sr-album-highlight{margin:22px 0;padding:18px;border-radius:18px;background:#19272e}.sr-album-highlight .release{display:grid;grid-template-columns:90px 1fr;gap:12px;align-items:center}.sr-album-highlight .release h3{margin:0}.sr-album-highlight .release .cover{grid-row:1/4}.sr-player-toggle{margin:0 0 15px;padding:0}.sr-player-toggle summary{padding:12px 0}.sr-player-toggle .sr-player-shell{margin-top:10px}.sr-apple-discover{margin-top:14px}.sr-apple-discover .btn{background:#e4eeee;color:#0b1116}.sr-playlist-direct{margin-bottom:8px}
          @media(max-width:650px){.heading:has(.sr-service-row){align-items:flex-start;flex-direction:column}.sr-next{padding:18px}.sr-countdown{gap:6px}.sr-countdown div{padding:10px 2px}.sr-countdown span{font-size:.6rem}.sr-service-row .btn{padding:9px 11px}.sr-apple-discover .btn{width:100%}}
          ''')
          p=Path('assets/sunriva-mist.js')
          s=p.read_text()
          start=s.index('function releaseCard')
          end=s.index('function videoCard')
          s=s[:start]+'''const appleArtist="https://music.apple.com/us/artist/sunriva/6785632733";
          const appleLinks={"5jnjFEgF8qZx4dMdC1riys":"https://music.apple.com/us/album/unbound-ep/6826632617","1a2LtG9n4eM7jx8mt2mimq":"https://music.apple.com/us/album/cold-laugh-single/6824188205","5RXHwe6GUE18oZZ5LnPjio":"https://music.apple.com/us/album/shards-ep/6817139865","4ENmUu3syMwsm0IZZly0G3":"https://music.apple.com/us/album/break-the-north-single/6814123106","4xCP7ykfCkz6Lo3gpNbFj3":"https://music.apple.com/us/album/cold-between-us-single/6786009610"};
          const smartLinks={"5jnjFEgF8qZx4dMdC1riys":"https://distrokid.com/hyperfollow/sunriva/unbound","0hkrTbzJkZx8d3tcIrctPd":"https://distrokid.com/hyperfollow/sunriva/aelvyra"};
          function serviceLinks(r,existing){
            const row=existing||el("div","sr-service-row");
            row.replaceChildren(external(el("a","btn primary","Spotify"),r.url),external(el("a","btn secondary",appleLinks[r.id]?"Apple Music":"Apple Music · Artist"),appleLinks[r.id]||appleArtist));
            if(smartLinks[r.id])row.append(external(el("a","btn secondary","More platforms"),smartLinks[r.id]));
            return row;
          }
          function releaseCard(r) {
            const item=el("article","release");
            const a=external(el("a","cover"),r.url);
            a.setAttribute("aria-label","Listen to "+r.name);
            if(r.cover){const img=el("img");img.src=r.cover;img.alt="";img.loading="lazy";a.append(img);}
            else a.append(el("span","sig","ᛚ"));
            item.append(a,el("h3","",r.name),el("p","meta",[typeLabel(r),formatDate(r.date)].filter(Boolean).join(" · ")),serviceLinks(r));
            return item;
          }
          let countdownTimer;
          const releaseTime=r=>Date.parse(r.releaseAt||r.date+"T00:00:00");
          function setupCountdown(items){
            clearInterval(countdownTimer);
            const root=$("[data-next]");
            const next=items.filter(r=>r.name&&Number.isFinite(releaseTime(r))&&releaseTime(r)>Date.now()).sort((a,b)=>releaseTime(a)-releaseTime(b))[0];
            if(!next){root.hidden=true;return;}
            $("[data-next-title]").textContent=next.name;
            $("[data-next-date]").textContent=new Date(releaseTime(next)).toLocaleDateString(document.documentElement.lang||"en",{day:"numeric",month:"long",year:"numeric"});
            const presave=$("[data-presave]");
            const url=next.presave||next.url;
            presave.hidden=!(typeof url==="string"&&/^https:\/\/(distrokid\.com\/hyperfollow\/|open\.spotify\.com\/|music\.apple\.com\/)/.test(url));
            if(!presave.hidden)external(presave,url);
            root.hidden=false;
            function tick(){
              const n=Math.max(0,Math.ceil((releaseTime(next)-Date.now())/1000));
              if(n<=0){clearInterval(countdownTimer);root.hidden=true;return;}
              for(const [k,v] of Object.entries({days:Math.floor(n/86400),hours:Math.floor(n/3600)%24,minutes:Math.floor(n/60)%60,seconds:n%60}))$("[data-"+k+"]").textContent=String(v).padStart(2,"0");
            }
            tick();countdownTimer=setInterval(tick,1000);
          }
          const schedule=fetch("data/sunriva-upcoming.json",{cache:"no-store"}).then(r=>r.ok?r.json():[]).then(v=>Array.isArray(v)?v:[]).catch(()=>[]);
          schedule.then(setupCountdown);
          loadCatalogue([id]).then(async releases=>{
            const upcoming=releases.filter(r=>releaseTime(r)>Date.now());
            setupCountdown([...(await schedule),...upcoming]);
            const published=releases.filter(r=>releaseTime(r)<=Date.now());
            if(!published.length)return;
            const r=published[0];
            $("[data-latest-title]").textContent=r.name;
            $("[data-latest-meta]").textContent=[typeLabel(r),formatDate(r.date),r.totalTracks>1?r.totalTracks+" tracks":""].filter(Boolean).join(" · ");
            serviceLinks(r,$("[data-latest-services]"));
            external($("[data-latest-cover-link]"),r.url).setAttribute("aria-label","Listen to "+r.name);
            const img=$("[data-latest-cover]");
            if(r.cover)img.src=r.cover;else img.hidden=true;
            $("[data-latest-release]").hidden=false;
            const album=published.find(x=>x.type==="album"||x.type==="ep");
            const albumBox=$("[data-album-highlight]");
            if(album&&album.id!==r.id){albumBox.replaceChildren(el("p","eyebrow","Latest album / EP"),releaseCard(album));albumBox.hidden=false;}
            $("[data-recent]").replaceChildren(...published.slice(1,5).filter(x=>!album||album.id===r.id||x.id!==album.id).map(releaseCard));
            setupList(published,{pageSize:8,leadId:id,filters:{collab:r=>r.type==="track"||r.artists.length>1}});
          }).catch(()=>{});
          '''+s[end:]
          # avoid changing shared core or other artist pages
          s=s.replace('https://open.spotify.com/embed/playlist/27QDkBCLpMStvufPMqthw4";','https://open.spotify.com/embed/playlist/27QDkBCLpMStvufPMqthw4?theme=0";')
          p.write_text(s)
          p=Path('assets/sunriva-menu.js')
          s=p.read_text()
          d={"Coming soon":["Demnächst","Væntanlegt"],"Days":["Tage","Dagar"],"Hours":["Stunden","Klukkustundir"],"Minutes":["Minuten","Mínútur"],"Seconds":["Sekunden","Sekúndur"],"Pre-save / Pre-add":["Pre-save / Pre-add","Vista fyrirfram"],"Latest album / EP":["Neuestes Album / EP","Nýjasta plata / EP"],"More platforms":["Weitere Plattformen","Fleiri streymisveitur"],"Apple Music · Artist":["Apple Music · Künstlerprofil","Apple Music · Listamaður"],"Listen to the Spotify playlist":["Spotify-Playlist anhören","Hlusta á Spotify-spilunarlistann"],"Discover SUNRIVA on Apple Music":["SUNRIVA auf Apple Music entdecken","Uppgötva SUNRIVA á Apple Music"]}
          s=s.replace('const translations={','const translations={'+json.dumps(d,ensure_ascii=False)[1:-1]+',',1)
          p.write_text(s)
          PY
          node --input-type=module --check < assets/sunriva-mist.js
          node --check assets/sunriva-menu.js
          python3 -m json.tool data/sunriva-upcoming.json >/dev/null
      - name: Commit verified update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sunriva.html assets/sunriva-mist.css assets/sunriva-mist.js assets/sunriva-menu.js data/sunriva-upcoming.json
          git rm .github/workflows/sunriva-music-update.yml
          git commit -m 'Balance Spotify and Apple Music, dark playlist and conditional countdown'
          git push origin HEAD:main
